<text x="1620" y="1036.5" class="body" text-anchor="middle">frame15 增强 tokens</text>
<text x="1620" y="1064.5" class="body" text-anchor="middle">导出 ball_latents</text>
<text x="940" y="1130" class="body green" text-anchor="start">新增：frame6 / 9 / 12 的直接状态监督（详见第二张图）</text>
<text x="940" y="1164" class="body green" text-anchor="start">保留：三目 mean、3 个末帧 tokens、原物理外推公式</text>
<line x1="60" y1="1220" x2="1740" y2="1220" stroke="#cbd4d9"/>
<text x="60" y="1262" class="node" text-anchor="start">两边都保留：原 patches → GS / MS3 / 语义 / Renderer → 原重建损失</text>
<text x="60" y="1303" class="body muted" text-anchor="start">GS 并非由增强 ball token 直接生成；新增监督可以通过共享主干间接影响重建。架构图不代表已测得精度提升。</text>
</svg>
