<rect x="75" y="270" width="720" height="65" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="435" y="310.5" class="node" text-anchor="middle">原因果 SLARM 主干</text>
<rect x="75" y="405" width="330" height="85" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="240" y="441.5" class="body" text-anchor="middle">frame15 原始 ball tokens</text>
<text x="240" y="469.5" class="body" text-anchor="middle">3 个视角 × 1536 维</text>
<rect x="470" y="405" width="320" height="85" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="630" y="441.5" class="body" text-anchor="middle">frame15 patches</text>
<text x="630" y="469.5" class="body" text-anchor="middle">各目自己的末帧特征</text>
<rect x="75" y="575" width="330" height="70" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="240" y="618" class="node" text-anchor="middle">三目 mean → 共享 MLP</text>
<rect x="75" y="705" width="330" height="75" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="240" y="736.5" class="body" text-anchor="middle">主 p15 / v15</text>
<text x="240" y="764.5" class="body" text-anchor="middle">原 velocity / traj / landing loss</text>
<rect x="75" y="860" width="330" height="75" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="240" y="905.5" class="node" text-anchor="middle">物理外推 → frame45</text>
<rect x="470" y="560" width="320" height="75" rx="6" fill="#eef4fd" stroke="#6889ad" stroke-width="1.8"/>
<text x="630" y="591.5" class="body" text-anchor="middle">导出 ball_latents</text>
<text x="630" y="619.5" class="body" text-anchor="middle">仍是原始 tokens</text>
<rect x="470" y="690" width="320" height="90" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="630" y="729" class="body" text-anchor="middle">仅 C：1536 维 cross-attn</text>
<text x="630" y="757" class="body" text-anchor="middle">每目 query 读同目末帧 patches</text>
<rect x="470" y="860" width="320" height="75" rx="6" fill="#fcf0f4" stroke="#c26a8a" stroke-width="1.8"/>
<text x="630" y="905.5" class="node" text-anchor="middle">共享 MLP → 逐目位置 loss</text>
<text x="490" y="977" class="body pink" text-anchor="start">C 的增强特征不进入左侧主状态，</text>
<text x="490" y="1006" class="body pink" text-anchor="start">也不替换导出的 ball_latents。</text>
<text x="75" y="1065" class="body muted" text-anchor="start">B：跳过 C 的 cross-attention，直接逐目读原始 token。</text>
<text x="75" y="1099" class="body muted" text-anchor="start">B/C 的逐目位置 loss 都替换旧 pooled-pos loss。</text>
<text x="75" y="1160" class="small muted" text-anchor="start">左侧实线：主输出 / 导出路径    虚线：C 辅助位置分支</text>
