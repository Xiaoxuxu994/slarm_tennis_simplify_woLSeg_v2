<text x="932" y="828" class="small green" text-anchor="start">残差连接</text>
<rect x="945" y="270" width="780" height="65" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="1335" y="310.5" class="node" text-anchor="middle">原因果 SLARM 主干（结构不变）</text>
<rect x="945" y="405" width="310" height="85" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="1100" y="441.5" class="body" text-anchor="middle">每个时刻的三目 ball tokens</text>
<text x="1100" y="469.5" class="body" text-anchor="middle">原 token z[t, view]</text>
<rect x="1350" y="405" width="375" height="85" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="1537.5" y="441.5" class="body" text-anchor="middle">每个时刻的三目 patches</text>
<text x="1537.5" y="469.5" class="body" text-anchor="middle">已有的历史观测特征</text>
<rect x="945" y="560" width="310" height="60" rx="6" fill="#e8f7f3" stroke="#19867b" stroke-width="1.8"/>
<text x="1100" y="598" class="node" text-anchor="middle">投影为 256 维 Query</text>
<rect x="1350" y="560" width="375" height="60" rx="6" fill="#e8f7f3" stroke="#19867b" stroke-width="1.8"/>
<text x="1537.5" y="598" class="node" text-anchor="middle">256 维 K/V 历史缓存</text>
<rect x="1060" y="685" width="550" height="90" rx="6" fill="#e8f7f3" stroke="#19867b" stroke-width="1.8"/>
<text x="1335" y="724" class="body" text-anchor="middle">因果 cross-attention + FFN</text>
<text x="1335" y="752" class="body" text-anchor="middle">读取当前及更早时刻的全部三目 patches</text>
<rect x="1060" y="835" width="550" height="90" rx="6" fill="#e8f7f3" stroke="#19867b" stroke-width="1.8"/>
<text x="1335" y="874" class="body" text-anchor="middle">z′ = z + 输出投影（初始为 0）</text>
<text x="1335" y="902" class="body" text-anchor="middle">增强后仍是每目 1536 维</text>
