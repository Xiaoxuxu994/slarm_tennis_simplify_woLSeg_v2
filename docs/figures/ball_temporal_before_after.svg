<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-label="Ball-token 改动前后：B/C 与联合版004">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#53616b"/></marker><marker id="new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#097d73"/></marker><marker id="loss" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b23d66"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#17232b;letter-spacing:0}.title{font-size:34px;font-weight:700}.heading{font-size:26px;font-weight:650}.node{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px}.muted{fill:#586873}.green{fill:#08776e}.pink{fill:#9e3057}</style>
<rect width="1800" height="1340" fill="#fff"/>
<text x="60" y="65" class="title" text-anchor="start">Ball-token：之前的 B/C 与新的联合版 004</text>
<text x="60" y="104" class="body muted" text-anchor="start">共同约束：仅输入三目 frame 0 / 3 / 6 / 9 / 12 / 15；GT 只用于监督，不进入新增 attention。</text>
<line x1="60" y1="140" x2="1740" y2="140" stroke="#cbd4d9"/><line x1="890" y1="170" x2="890" y2="1210" stroke="#d4dde1"/>
<text x="75" y="197" class="heading" text-anchor="start">之前：B / C</text>
<text x="75" y="231" class="body muted" text-anchor="start">主状态与导出仍走原始末帧 token</text>
<text x="940" y="197" class="heading green" text-anchor="start">现在：联合版 004</text>
<text x="940" y="231" class="body green" text-anchor="start">增强 token 真正进入主状态、监督与导出</text>
