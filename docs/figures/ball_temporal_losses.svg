<rect x="475" y="745" width="385" height="70" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="667.5" y="788" class="node" text-anchor="middle">每目 → 共享 MLP → p[t,view]</text>
<rect x="475" y="920" width="385" height="90" rx="6" fill="#f6f8fa" stroke="#9caab2" stroke-width="1.8"/>
<text x="667.5" y="959" class="body" text-anchor="middle">三目 mean → 同一个共享 MLP</text>
<text x="667.5" y="987" class="body" text-anchor="middle">得到 pooled p_t / v_t</text>
<rect x="940" y="735" width="775" height="90" rx="6" fill="#fcf0f4" stroke="#c26a8a" stroke-width="1.8"/>
<text x="1327.5" y="774" class="body" text-anchor="middle">位置：与同一时刻同一个 GT 球心比较</text>
<text x="1327.5" y="802" class="body" text-anchor="middle">按 batch / view / xyz 平均；SmoothL1，位置尺度 0.1 m</text>
<rect x="940" y="905" width="775" height="85" rx="6" fill="#fcf0f4" stroke="#c26a8a" stroke-width="1.8"/>
<text x="1327.5" y="941.5" class="body" text-anchor="middle">速度：v_t 与该时刻 GT 速度比较</text>
<text x="1327.5" y="969.5" class="body" text-anchor="middle">SmoothL1，沿用原 velocity 归一化尺度</text>
<rect x="940" y="1040" width="775" height="110" rx="6" fill="#fcf0f4" stroke="#c26a8a" stroke-width="1.8"/>
<text x="1327.5" y="1075" class="body" text-anchor="middle">接球点：由 p_t / v_t 按重力外推至同一个 frame45</text>
<text x="1327.5" y="1103" class="body" text-anchor="middle">每个 prefix 使用自己的 Δt = t_catch − t</text>
<text x="1327.5" y="1131" class="body" text-anchor="middle">与解析 GT 接球点比较；不是分别外推固定 1 秒</text>
<text x="70" y="1085" class="body muted" text-anchor="start">所有 GT 只参与右侧 loss，</text>
<text x="70" y="1117" class="body muted" text-anchor="start">不会输入新增 attention。</text>
<line x1="60" y1="1190" x2="1740" y2="1190" stroke="#cbd4d9"/>
<text x="60" y="1232" class="node" text-anchor="start">总损失 = 原 B 损失 + 0.25 × Lprefix_pos + 0.25 × Lprefix_vel + 0.25 × Lprefix_landing</text>
<text x="60" y="1270" class="small muted" text-anchor="start">每个 prefix loss 内部：frame6 / 9 / 12 按 1/7、2/7、4/7 加权。末帧原 velocity / trajectory / landing 与重建权重不变。</text>
