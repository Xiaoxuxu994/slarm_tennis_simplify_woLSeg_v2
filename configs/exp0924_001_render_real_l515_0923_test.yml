# Zero-shot render of the 0908_10k pixel checkpoint on real L515 captures.
# Test only: two scenes (scene_40000, scene_40001), no training split, so
# train_annotation and eval_annotation point at the same manifest.
# Model keys are copied from exp0915_001 unchanged -- the checkpoint only loads
# into the architecture it was trained with.
#
# Manifest lives in the data root (slarm_data_real/scene_list/), like every
# other dataset; run_sh/render_real_l515.sh writes it if it is missing.
model: slarm
dataset: [ball_catch_real_l515_0923]
data_root: slarm_data_real
input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 3
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8
mode: window_6
stream25_catch_frame: 45
stream25_ball_radius: 0.0325
use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0
strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7
stream25_reconstruction_loss: true

use_ball_token: false
use_ball_token_intrunk: false
ball_token_freeze_backbone: false
ball_velocity_residual: false
ball_velocity_only_train: false
ball_temporal_refine: false
ball_prefix_supervision: false
ball_pos_supervision: pooled
stream25_ball_pos_weight: 0
stream25_ball_vel_weight: 0
stream25_ball_traj_weight: 0
stream25_landing_weight: 0
stream25_ball_delta_v_weight: 0
stream25_ball_prefix_pos_weight: 0
stream25_ball_prefix_vel_weight: 0
stream25_ball_prefix_landing_weight: 0

# Preserve the original pixel-path supervision and MS3 physical scales.
stream25_rgb_weight: 1
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.5
stream25_depth_relative_weight: 1
stream25_ball_depth_metric_weight: 0.5
stream25_semantic_weight: 1
stream25_ms3_ball_weight: 1
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.1
stream25_ms3_velocity_scale: 5
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1
terminal_dynamic_velocity_threshold: 1
stream25_semantic_class_weight_cap: 10
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0
stream25_lseg_feature_weight: 0
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

lr: 0.00005
stream25_trunk_lr: 0.000005
lr_sched: cosine
min_lr: 1.0e-7
warmup_iters: 1000
batch_size: 1
seed: 20260915
load_from: work_dirs/slarm/exp0915_001_slarm_stream25_0908_10k_pixel_finetune/checkpoints/ckpt_019999.pth
train_annotation: scene_list/ball_catch_real_l515_0923_test.txt
eval_annotation: scene_list/ball_catch_real_l515_0923_test.txt
num_iterations: 20000
ckpt_every_n_iters: 2000
vis_every_n_iters: 2000
num_vis_samples: 2
eval_every_n_iters: 50000
keep_n_ckpts: 10
project: slarm
exp_name: exp0924_001_render_real_l515_0923_test
