# Pure control for exp0910_004: ONE substantive change, stream25_ball_vel_scale.
#
# Why. record() in stream25_losses.py computes smooth_l1(pred/scale, gt/scale),
# so a SMALLER scale means MORE weight. The velocity scale defaults to
# ball_vel_scale_from_timespan(0.8) = 0.1 m / 0.3 s = 0.333, where 0.3 s is
# frame 15 -> last rendered target (frame 24). But this dataset catches at
# frame 45, so the real lever arm is (45-15)/30 = 1.005 s and the correct
# scale is 0.1 m / 1.0 s = 0.1. Running at 0.333 down-weights velocity 3.33x.
# The star note at stream25_losses.py:379 says to run this control FIRST.
# exp0910_004 never set the key, so it trained with velocity down-weighted.
#
# Evidence this matters, from the four-checkpoint sweep of exp0910_004:
#     v15 ms3        0.0949 -> 0.0975 -> 0.0988 -> 0.1008   monotonically WORSE
#     rgb psnr      29.7727 -> 29.9029 -> 29.9242 -> 29.9461 monotonically better
#     depth absrel   0.0768 -> 0.0756 -> 0.0750 -> 0.0750    monotonically better
# Velocity degrades while reconstruction improves, on all four points, in
# opposite directions. That is a multi-task weighting problem, not overfitting.
#
# Gradient magnitude warning. smooth_l1 is quadratic in this range, so the
# gradient on velocity grows by (0.333/0.1)^2 = 11x, not 3.33x. Watch the
# first 200 steps: stream25_ball_vel_raw should fall, not oscillate. If it
# diverges, that is itself the answer and 0.2 is the fallback.
#
# The checkpoint interval also drops 1000 -> 250 (and keep_n_ckpts 4 -> 16).
# That is a measurement change, not a training change: exp0910_004 had its
# best velocity at its EARLIEST checkpoint (999), so the minimum lies
# somewhere in [0, 999] and was never observed. 250 finds it.
#
# Read as: seed, data, load_from, LR schedule, every loss weight and every
# architecture flag are byte-identical to exp0910_004. Any difference in
# v15 belongs to the scale.
#
# Acceptance. v15 ms3 (pixel head) beats 0.0949 at some checkpoint, and
# pos15 does not regress past 0.045. If velocity improves and position
# holds, the scale was the problem and every structural experiment on top
# of exp0910_004 was run on a miscalibrated baseline.
