# v3_0829 数据 · 6.5cm 小球 · 双视图（front_left + front_right）迁移微调
#
# ═══════════════════════════════════════════════════════════════
# 与 exp0901_001 逐键相同，只差 num_max_cameras: 3 -> 2。
# 两组之差 = 视图数之差，没有别的解释 —— 这是这组存在的全部理由。
#
# 起点同为 exp0827_003 退火终点 ckpt_005999（三视图训练的 backbone）。
# ═══════════════════════════════════════════════════════════════
#
# ── 从三视图 ckpt 起步为什么可行 ────────────────────────────────
#
# 全网络只有一个参数随相机数变形状：
#     aggregator.affine_token   (1, num_cams, 768)      aggregator.py:189
# 其余（patch_embed / 12 层 alternating attention / gaussian head /
# sky token / 语义头）与视图数完全无关。
#
# misc.py 的 _remap_camera_specific_state_dict 按**相机名**做 index_select：
#     source [front_left, front_right, lower_front]  (ckpt 的 args 里解出来)
#     target [front_left, front_right]               (本 config)
#     -> indices [0, 1]，取前两行，丢掉 lower_front 那一行
# 形状对上，load_state_dict(strict=False) 正常通过。不需要任何转换脚本。
#
# ★ 是 load_from 不是 resume_from。optimizer 的 exp_avg 维度对不上，
#   别对这个 config 用 --auto_resume 去接三视图的 run。
#
# ★ 开跑前必做的自检（missing 应为空、unexpected 应为 0）：
#       python tools/check_model_init.py --config configs/exp0902_001_slarm_stream25_v3_0829_stereo_window6_nolseg_finetune.yml
#   日志里应当出现一行
#       [Model-init] Camera mapping: source=[...3个...], target=[...2个...], indices=[0, 1]
#   没有这一行就说明走错了分支（多半是 ckpt 里的 args 解不出相机名），停下来查。
#
# ── 预期会掉点，掉在哪里是这组要回答的问题 ────────────────────
#
# 误差的 95.5% 在深度方向，而 front_left/front_right 是水平基线，
# lower_front 提供的是垂直基线。砍掉它，深度只剩一个约束方向。
#
# 量级参考（GT 三角化精度，同一批数据）：
#     n_views = 3   ->  RMS 5.61 mm
#     n_views = 2   ->  RMS 11.11 mm      约 2 倍
# 那是标注的数字，但反映的是同一个几何事实，模型侧的退化不会比它更好。
#
# 判据：跟 exp0901_001 同一次 verify 的 pos15 / frame24 比。
#     退化 < 1.5x  -> 双视图可用，省一路相机是划算的
#     退化 ~ 2x    -> 与几何预期一致，是基线问题不是模型问题，
#                     再加视图数以外的手段（ball token / 时序约束）也补不回来
#     退化 > 3x    -> 不是几何能解释的，先查数据（见下）
#
# ── 数据侧必须先做的一件事 ────────────────────────────────────
#
# 球的可见性会变差：三视图下抽查 5 个场景已有 2 个出现"某个 context 帧全盲"，
# 其中一个是 frame 15（外推锚点）。只剩两个视角只会更糟，那类场景在
# frame24 指标里是纯噪声，会把两组的对比污染掉。
#
#     python tools/check_dataset_contract.py --data-root data/slarm_data \
#         --num-cams 2 --visibility-summary --limit 0
#
# ★ 如果双视图下要剔除的场景比三视图多，两组就不能用同一份 scene_list 比。
#   正确做法是取两者的交集当共同 scene_list，否则测的是"数据集难度差"
#   而不是"视图数差"。
#
# ── 卡数与 batch ──────────────────────────────────────────────
#
# token 数是 t·v·P，v 从 3 降到 2，显存省约 1/3。
# ★ 但 batch_size 保持 1、卡数保持 2 —— batch_size 是 per-GPU 且代码里没有
#   梯度累积，一改全局 batch 就和 exp0901_001 不可比了。省下的显存宁可空着。
#   真要用，调 stream25_render_target_chunk_size，那个不影响优化口径。
model: slarm
dataset: [ball_catch_triview_v3_0829]
data_root: data/slarm_data

input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 2                   # ★ 本 config 唯一的实验变量
                                     #   同时驱动两侧：datasets.py:266 查 camera_list[2]
                                     #   = [front_left, front_right]；engine_tools.py:57
                                     #   把它传成 num_cams，决定 affine_token 的形状
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8
mode: window_6

use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0

strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7
stream25_reconstruction_loss: true

# ---- 不开 ball token（与 exp0901_001 一致）----
use_ball_token: false
use_ball_token_intrunk: false

# ---- 损失权重：与 exp0901_001 逐键相同 ----
stream25_rgb_weight: 1.00
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.50
stream25_depth_relative_weight: 1.00
stream25_ball_depth_metric_weight: 0.5
stream25_semantic_weight: 1.00
stream25_ms3_ball_weight: 1.00
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.10

stream25_ms3_velocity_scale: 5.0
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1.0
terminal_dynamic_velocity_threshold: 1.0
stream25_semantic_class_weight_cap: 10.0

# ---- 无 LSeg ----
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0.0
stream25_lseg_feature_weight: 0.0
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

# ---- 优化：与 exp0901_001 逐键相同 ----
# affine_token 是从三视图里切出来的、不是随机初始化，所以不需要额外的
# warmup 保护 backbone；warmup_iters 保持 1000 只为与对照组一致。
lr: 5.0e-5
stream25_trunk_lr: 5.0e-6
lr_sched: cosine                     # ★ 不许改。constant 跑到底会让末点 ckpt
                                     #   只是盆地里的一次采样（stage1 摆动 3.5x 的教训）
min_lr: 1.0e-7
warmup_iters: 1000
batch_size: 1
seed: 20260901                       # ★ 与 exp0901_001 同 seed，两组可比

load_from: work_dirs/slarm/exp0827_003_slarm_stream25_6.5cm_triview_window6_nolseg_anneal/checkpoints/ckpt_005999.pth

train_annotation: scene_list/ball_catch_triview_v3_0829_train.txt
eval_annotation: scene_list/ball_catch_triview_v3_0829_validation.txt
num_iterations: 20000
ckpt_every_n_iters: 2000
vis_every_n_iters: 4000
num_vis_samples: 1
eval_every_n_iters: 50000
keep_n_ckpts: 10
project: slarm
exp_name: exp0902_001_slarm_stream25_v3_0829_stereo_window6_nolseg_finetune
