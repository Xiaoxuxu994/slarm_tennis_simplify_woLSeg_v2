# catch45 场景微调（noLSeg）：从 6.5cm 退火终点迁移到新场景
#
# ─────────────────────────────────────────────────────────────
# 起点：exp0827_003 的 ckpt_005999 —— 目前最好的 backbone。
#   200 场景完整评测（对比之前最好的 stage1 采样点 029999）：
#       frame24        0.038/0.095  ->  0.026/0.070
#       ball_depth far 0.028/0.066  ->  0.013/0.033   （腰斩）
#       ball_iou far   0.500        ->  0.742         （+48%）
#       rgb_psnr a/f   29.79/28.57  ->  34.68/33.78   （+4.9/+5.2 dB）
#   它也全面超过 wLSeg 的 exp003（frame24 0.046/0.101）。
#
# ★ 本 config 唯一不许动的一条：lr_sched 必须是 cosine。
#   stage1 用 constant 跑满 40k，pos15 在 0.031~0.111 之间摆 3.5×，没有收敛点，
#   每个存档都只是盆地里的一次采样；补 6k 步 cosine 之后立刻落定并大幅变好。
#   这是这几天最大的收获，适用于此后每一组训练。
# ─────────────────────────────────────────────────────────────
#
# 数据契约已核对（2026-08-28，check_dataset_contract.py，600 场景抽 3）：
#   dataset 名  = ball_catch_6.5cm_triview_catch45    与下面和 constants.py 两处注册一致
#   timespan    = 0.8                                 二阶差分反推重力自洽，通过
#   scene_list  = ..._train.txt / ..._validation.txt  与下面一致（另有 _final_test.txt）
#   其余 38 项契约检查全部通过。
#
# ★ 但有一个数据层面的限制，解读本组结果时必须先看它：
#
#   context 帧（[0,3,6,9,12,15]）的球可见性在后段掉得厉害，且模式很固定 ——
#   永远是 front_left + front_right 一起失明，永远是后段帧，frame15 最严重，
#   lower_front 基本不受影响。物理上说得通：球朝相机飞来，到 frame15 已经
#   飞出前视双目的视野，只有朝下那个还看得见。
#
#   代价不在训练（下面这段是查过代码的，别再按"监督缺失"理解）：
#     - datasets.py:1088 用语义图里真实的球像素覆盖 JSON 声明的可见性；
#     - 损失只读逐像素 ball_mask，且有 if ball_mask.any() 兜底 ——
#       那些 (帧,视图) 格子对 ball_rgb / ball_depth 贡献 0，不会崩；
#     - position_rig / velocity_rig / MS3 来自 ball_trajectory，与可见性无关，完全不受影响；
#     - ball_visible 这个字段在 src/utils 和 src/models 里一次都没被用到，只有 eval 读。
#
#   代价在推理：像素法给每个"看得见球"的视图反投影一条射线取 median。
#   frame15 只剩一个视图时就退化成单视图反投影，而深度已经是 frame24 误差的 95%。
#   frame15 是 terminal frame —— 物理外推的起点、terminal_context_extrapolation 的锚点。
#
#   所以开跑前先跑这两条，拿到分布再决定怎么读后面的数字：
#       python tools/check_dataset_contract.py --data-root data/slarm_data_catch45 --visibility-summary
#       python tools/check_dataset_contract.py --data-root data/SLARM_data_6.5 --visibility-summary
#   后者是对照 —— 6.5cm 是退火跑出 frame24=0.026 的那份数据。两张表的 frame15 行如果
#   差不多，说明这是这类数据的常态；如果 6.5cm 接近全 0，那 catch45 就是数据层面多了
#   一个天花板，指标掉下来别算模型的账。all-blind 那列非零的场景无法挽救 ——
#   三视图都看不见球，那一帧根本没法定位，frame15 全盲的场景是纯噪声。
#
# LR 怎么定 —— 先测 zero-shot，别拍脑袋：
#   用退火 ckpt + 本 config 直接跑一次 eval（不训练），看崩到什么程度。
#     崩得厉害（frame24 > 0.3，语义分不出球）= 大 domain shift，把 lr 提到 1.0e-4，
#         参照 exp0825_002 当年 24cm→6.5cm 的做法（那次 zero-shot pos15 崩到 2.3m）；
#     只是变差一档（frame24 0.05~0.1）= 同量级场景差异，下面的 5e-5 正合适；
#     几乎没退化 = 直接拿退火 ckpt 用，这组微调都未必需要。
#   catch45 相对 6.5cm 已知的实质差异是 rig 原点离地 1.0m（原来 1.5m）——
#   模型对"地面在 rig 下大概多低"是有先验的，这一项就够造成可观的退化。
model: slarm
dataset: [ball_catch_6.5cm_triview_catch45]
data_root: data/slarm_data_catch45

input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 3
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8                # 已核对：重力自洽检查通过
mode: window_6

use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0

strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7
stream25_reconstruction_loss: true

# ---- 不开 ball token ----
# A 组已判负：冻结 backbone 下 ball token 的 frame24 是 0.087，像素法是 0.038（差 2.3x），
# 而退火把像素法推到 0.026，差距变成 3.3x。新场景迁移不该带上一个没被证实的模块。
use_ball_token: false

# ---- 损失权重：与 exp0825_002 / exp0827_003 逐项一致 ----
# 迁移实验只该改数据和 LR。权重一起动的话，指标退化说不清是数据的锅还是权重的锅。
stream25_rgb_weight: 1.00
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.50
stream25_depth_relative_weight: 1.00
stream25_ball_depth_metric_weight: 0.5
stream25_semantic_weight: 1.00
stream25_ms3_ball_weight: 1.00
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.10

stream25_ms3_velocity_scale: 5.0
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1.0
terminal_dynamic_velocity_threshold: 1.0
stream25_semantic_class_weight_cap: 10.0

# ---- 无 LSeg ----
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0.0
stream25_lseg_feature_weight: 0.0
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

# ---- 优化 ----
lr: 5.0e-5                   # 场景迁移的默认值；先按上面的 zero-shot 结果确认再开跑
stream25_trunk_lr: 1.0e-5    # 保持 5:1
lr_sched: cosine             # ★ 不许改成 constant，理由见抬头
min_lr: 1.0e-6
warmup_iters: 1000           # 起点是退火落定的收敛点，warmup 保护它不被前几步冲掉
batch_size: 1                # per-GPU；全局 batch = batch_size x 卡数，代码里没有梯度累积
seed: 20260828

# ★ 起点：6.5cm 退火终点（当前最好的 backbone）
load_from: work_dirs/slarm/exp0827_003_slarm_stream25_6.5cm_triview_window6_nolseg_anneal/checkpoints/ckpt_005999.pth

train_annotation: scene_list/ball_catch_6.5cm_triview_catch45_train.txt          # 已核对
eval_annotation: scene_list/ball_catch_6.5cm_triview_catch45_validation.txt      # 已核对
num_iterations: 20000        # cosine 按这个长度铺开；中途改它 LR 曲线会跳变
ckpt_every_n_iters: 2000
vis_every_n_iters: 4000
num_vis_samples: 1
eval_every_n_iters: 50000
keep_n_ckpts: 10
project: slarm
exp_name: exp0828_003_slarm_stream25_catch45_triview_window6_nolseg_finetune
