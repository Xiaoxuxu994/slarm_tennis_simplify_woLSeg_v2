# 6.5cm ball token · B 组：放开 backbone，端到端训练
#
# 与 A 组（frozen）的唯一区别是 ball_token_freeze_backbone: false 以及随之调整的 LR。
# 前提、基线、判据见 A 组 config 开头那段（那里写了为什么误差出在深度而不在选球）。
#
# ─────────────────────────────────────────────────────────────
# 这组存在的理由，和 A 组不一样：
#
#   A 组问的是「现有表征里的球信息够不够读出来」。
#   B 组问的是「如果不够，backbone 能不能为球定位再学一点」。
#
#   而 verify 已经告诉我们误差 95.5% 在深度方向 —— 深度是 backbone 的活，
#   不是 ball head 能补的。所以如果 A 组只小赢或不赢，B 组反而是更有希望的一组：
#   只有放开 backbone，才可能改善它对小球距离的估计。
#   代价是可能把已经收敛的重建能力赔进去，所以下面 LR 压得很低。
# ─────────────────────────────────────────────────────────────
#
# LR 是这么定的（有个内在矛盾）：
#
#   ball token 是随机初始化的新模块，需要较大 LR 才学得起来；
#   而 backbone 已经在 6.5cm 上训了 40k，大 LR 会把它破坏掉。
#
#   麻烦在于 make_stream25_param_groups 只分 trunk / head 两组，
#   ball_query/ball_block/ball_head 被归进 head（_TRUNK_PREFIXES 只含
#   aggregator. / patch_embed / aggregated_last_tokens_norm），
#   也就是说 ball token 和 gaussian head、语义头共用同一个 args.lr —— 没法只给 ball token 开大。
#
#   折中：head LR 降到 stage1 的 30%，trunk LR 压得更狠（比例从 5:1 收到 10:1）。
#   宁可 ball token 学慢一点，也不能把重建赔进去。
#
#   如果跑下来 ball token 收敛太慢，正确的做法不是调大这里的 LR，
#   而是改走两阶段：先用 A 组的 frozen 产物做 load_from，再用这份 config 端到端微调。
#
# 必须盯的指标（比 A 组多）：
#   A 组冻结，dense loss 无梯度，只看 ball_pos_l2_m 就够；
#   B 组所有 loss 都在改参数，必须同时盯 stream25_rgb_raw / depth_relative_raw /
#   semantic_raw。如果 ball loss 在降而这些在涨，说明 ball 监督正在拖垮重建 ——
#   那时应降低 stream25_ball_pos_weight 或退回两阶段方案。
model: slarm
dataset: [ball_catch_6.5cm_triview]
data_root: data/SLARM_data_6.5

input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 3
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8
mode: window_6

use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0

strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7
stream25_reconstruction_loss: true

# ---- ball token ----
use_ball_token: true
ball_token_freeze_backbone: false     # ★ B 组：放开。全部参数参与训练
stream25_ball_pos_weight: 1.0
stream25_ball_vel_weight: 1.0
# 端到端下这两个权重会把梯度送回 backbone。若重建指标退化，先降这里再考虑降 LR。

# ---- 损失权重：与 exp0825_002 / A 组完全一致 ----
stream25_rgb_weight: 1.00
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.50
stream25_depth_relative_weight: 1.00
stream25_ball_depth_metric_weight: 0.5
stream25_semantic_weight: 1.00
stream25_ms3_ball_weight: 1.00
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.10

stream25_ms3_velocity_scale: 5.0
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1.0
terminal_dynamic_velocity_threshold: 1.0
stream25_semantic_class_weight_cap: 10.0

# ---- 无 LSeg ----
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0.0
stream25_lseg_feature_weight: 0.0
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

# ---- 优化（同域微调：backbone 已训 40k，LR 必须比 stage1 小得多）----
# stage1 是 1e-4 / 2e-5，那是跨域迁移（24cm → 6.5cm，要重学小球尺度）；
# 这里是同域续训，backbone 只需微调，用那个 LR 会把已学到的东西冲掉。
lr: 3.0e-5                   # stage1 的 30%
stream25_trunk_lr: 3.0e-6    # 比例从 5:1 收到 10:1，backbone 改得更慢
lr_sched: constant
min_lr: 1.0e-6
warmup_iters: 1000           # 随机初始化的 ball token 初期梯度很大，warmup 保护 backbone
batch_size: 1
seed: 20260827               # ★ 与 A 组同 seed：ball_query 初始值相同，两组可比

# ★ 与 A 组同一个起点：029999（sweep 里像素法最好的点，0.0312）。
#   选它的理由见 A 组 config 的 load_from 段 —— 让 ball token 去打像素法的最佳状态，
#   是一次偏保守的比较。A/B 必须同起点，否则两组之间不可比。
#
#   本组还有一层：放开 backbone 后 029999 会被继续改动，
#   所以"像素法最佳状态"这个性质只在第 0 步成立，之后两条路径一起变。
#   判读时看的是训练末尾同一次 verify 里 balltoken 对 pred 的差，不是对 0.0312 的差。
load_from: work_dirs/slarm/exp0825_002_slarm_stream25_6.5cm_triview_window6_nolseg_loadpre/checkpoints/ckpt_029999.pth
#
# 两阶段方案（若 A 组证明 ball token 有效、而本组收敛慢时改用）：
# load_from: work_dirs/slarm/exp0827_001_slarm_stream25_6.5cm_triview_window6_nolseg_balltoken_frozen/checkpoints/ckpt_009999.pth

train_annotation: scene_list/ball_catch_6.5cm_triview_train.txt
eval_annotation: scene_list/ball_catch_6.5cm_triview_validation.txt
num_iterations: 15000        # 同域微调，不需要 stage1 的 40k
ckpt_every_n_iters: 1000
vis_every_n_iters: 2000
num_vis_samples: 1
eval_every_n_iters: 50000
keep_n_ckpts: 15
project: slarm
exp_name: exp0827_002_slarm_stream25_6.5cm_triview_window6_nolseg_balltoken_e2e
