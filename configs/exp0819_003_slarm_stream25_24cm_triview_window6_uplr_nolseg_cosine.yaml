# Tri-view Stream25 No-LSeg —— cosine 学习率对照（003）。
# 与 exp0819_001 唯一差别：lr_sched constant -> cosine。用来干净回答
# “大 LR(1e-4) 下，cosine 后期衰减是否比 constant 更好”。其余（batch=1 / 大 LR / warmup / 40k / init）全同 001。
model: slarm
dataset: [ball_catch_24cm_triview]
data_root: data/SLARM_data

input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 3
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8
mode: window_6

use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0

strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7   # 一次渲全部 7 个 target，更快；数值与 1 等价，只是更吃显存
stream25_reconstruction_loss: true

# ---- 损失权重 ----
stream25_rgb_weight: 1.00
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.50
stream25_depth_relative_weight: 1.00
stream25_ball_depth_metric_weight: 0.02
stream25_semantic_weight: 1.00
stream25_ms3_ball_weight: 1.00
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.10

stream25_ms3_velocity_scale: 5.0
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1.0
terminal_dynamic_velocity_threshold: 1.0
stream25_semantic_class_weight_cap: 10.0

# ---- 无 LSeg：online_feat / feat_loss 全部关闭（woLSeg_v2 代码删了 LSegFeatureExtractor）----
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0.0                 # 显式归零，避免 log 里显示 default 1.0 引起误解
stream25_lseg_feature_weight: 0.0    # 同上（loss 本就硬编码 0，这里只为 log 清晰）
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

# ---- 优化（大 LR + cosine 衰减；与 001 唯一差别）----
lr: 1.0e-4
stream25_trunk_lr: 2e-5
lr_sched: cosine        # 唯一与 001 不同处：后期余弦衰减到 min_lr
min_lr: 1.0e-6
warmup_iters: 1000
batch_size: 1
seed: 20260730

# waymo→triview 迁移 init（一步到位大 LR）
load_from: ckpts/ckpt_003999_slarm_trans.pth

train_annotation: scene_list/ball_catch_24cm_triview_train.txt
eval_annotation: scene_list/ball_catch_24cm_triview_validation.txt
num_iterations: 40000
ckpt_every_n_iters: 2000    # 40k/2k=20 个存档，配 keep 20 全留，便于按 eval 挑最优 ckpt
vis_every_n_iters: 5000
num_vis_samples: 1
eval_every_n_iters: 50000
keep_n_ckpts: 20
project: slarm
exp_name: exp0819_003_slarm_stream25_24cm_triview_window6_uplr_nolseg_cosine
